name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: 'Skip deployment step'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Parallel Unit & Quality Tests
  # ============================================================================

  test-backend:
    name: Backend Tests (FastAPI / Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          uv sync --project week_3/backend

      - name: Run Backend Unit & API Tests
        run: |
          uv run --project week_3/backend pytest week_3/backend/tests/test_api.py -v

  test-frontend:
    name: Frontend Tests (React / Vite / Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: week_3/frontent/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm ci --prefix week_3/frontent

      - name: Lint Frontend
        run: |
          npm run lint --prefix week_3/frontent

      - name: Run Frontend Unit Tests
        run: |
          npm test --prefix week_3/frontent

      - name: Build Frontend Bundle
        run: |
          npm run build --prefix week_3/frontent

  # ============================================================================
  # 2. Integration & Playwright E2E Tests against Docker Compose Stack
  # ============================================================================

  integration-and-e2e:
    name: Docker Compose Integration & Playwright E2E
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E test dependencies & Playwright browsers
        run: |
          npm ci --prefix e2e
          npx playwright install --with-deps chromium --prefix e2e

      - name: Build and Start Docker Compose Stack
        run: |
          docker compose up -d --build
          echo "Waiting for backend service to become healthy..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/api/v1/restaurant > /dev/null; then
              echo "App is healthy and responding!"
              break
            fi
            echo "Waiting for app to start... (attempt $i/30)"
            sleep 2
          done

      - name: Run PostgreSQL Integration Tests
        run: |
          uv sync --project week_3/backend
          uv run --project week_3/backend pytest week_3/backend/tests/test_compose_integration.py -v

      - name: Run Playwright Multi-Session E2E Tests
        run: |
          make e2e

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Tear Down Docker Compose
        if: always()
        run: |
          docker compose down -v

  # ============================================================================
  # 3. Deploy to Render / AWS & Validate Health Endpoint
  # ============================================================================

  deploy:
    name: Deploy to Render / AWS & Validate Health
    needs: [integration-and-e2e]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.skip_deploy))
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # For AWS OIDC authentication if used
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------------------------------------------------
      # Render Deployment (Deploy Hooks or Render API)
      # ------------------------------------------------------------------------
      - name: Trigger Render Backend Deployment
        if: "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK != '' || secrets.RENDER_DEPLOY_HOOK != '' }}"
        run: |
          HOOK_URL="${{ secrets.RENDER_BACKEND_DEPLOY_HOOK || secrets.RENDER_DEPLOY_HOOK }}"
          echo "Triggering Render Backend Deployment via Deploy Hook..."
          curl -f -X POST "$HOOK_URL"
          echo "Render Backend deployment triggered successfully!"

      - name: Trigger Render Frontend Deployment
        if: "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK != '' }}"
        run: |
          echo "Triggering Render Frontend Deployment via Deploy Hook..."
          curl -f -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"
          echo "Render Frontend deployment triggered successfully!"

      - name: Trigger Render via API Key (Alternative)
        if: "${{ secrets.RENDER_API_KEY != '' && secrets.RENDER_SERVICE_ID != '' }}"
        run: |
          echo "Triggering Render deploy via API Key for service ${{ secrets.RENDER_SERVICE_ID }}..."
          curl -f -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Accept: application/json"
          echo "Render API deployment triggered successfully!"

      # ------------------------------------------------------------------------
      # AWS Deployment via GitHub OIDC (If AWS_ROLE_ARN is configured)
      # ------------------------------------------------------------------------
      - name: Configure AWS Credentials via OIDC
        if: "${{ secrets.AWS_ROLE_ARN != '' }}"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: GitHubActions-MaitreQ-${{ github.run_id }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR (if configured)
        id: login-ecr
        if: "${{ secrets.AWS_ROLE_ARN != '' && secrets.AWS_ECR_REPOSITORY != '' }}"
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to Amazon ECR
        if: "${{ secrets.AWS_ROLE_ARN != '' && secrets.AWS_ECR_REPOSITORY != '' }}"
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.AWS_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Docker image for AWS deployment..."
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Trigger AWS Service Deployment (ECS / App Runner)
        if: "${{ secrets.AWS_ROLE_ARN != '' }}"
        env:
          ECS_CLUSTER: ${{ secrets.AWS_ECS_CLUSTER }}
          ECS_SERVICE: ${{ secrets.AWS_ECS_SERVICE }}
          APP_RUNNER_ARN: ${{ secrets.AWS_APP_RUNNER_ARN }}
        run: |
          if [ -n "$ECS_CLUSTER" ] && [ -n "$ECS_SERVICE" ]; then
            echo "Deploying to Amazon ECS ($ECS_CLUSTER / $ECS_SERVICE)..."
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --force-new-deployment
            echo "Waiting for ECS service deployment to stabilize..."
            aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
          elif [ -n "$APP_RUNNER_ARN" ]; then
            echo "Deploying to AWS App Runner ($APP_RUNNER_ARN)..."
            OPERATION_ID=$(aws apprunner start-deployment --service-arn "$APP_RUNNER_ARN" --query 'OperationId' --output text)
            echo "App Runner deployment triggered with operation ID: $OPERATION_ID"
          fi

      # ========================================================================
      # 4. Validate Deploy Success via Health Endpoint
      # ========================================================================

      - name: Validate Deployment via Health Endpoint
        env:
          HEALTH_URL: ${{ vars.APP_HEALTH_URL || secrets.APP_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "WARNING: APP_HEALTH_URL not provided. Skipping live HTTP health check."
            echo "To enable live verification, set APP_HEALTH_URL in GitHub repo variables or secrets (e.g. https://api.yourdomain.com/api/v1/restaurant)."
            exit 0
          fi

          echo "Validating health endpoint at: $HEALTH_URL"
          MAX_ATTEMPTS=30
          SLEEP_SECONDS=10

          for ((i=1; i<=MAX_ATTEMPTS; i++)); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || true)
            echo "Attempt $i/$MAX_ATTEMPTS - Health endpoint returned HTTP $HTTP_STATUS"
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "Deployment validation SUCCESSFUL! Service is healthy and responding with HTTP 200."
              exit 0
            fi
            sleep $SLEEP_SECONDS
          done

          echo "Deployment validation FAILED: Health endpoint did not return HTTP 200 within $((MAX_ATTEMPTS * SLEEP_SECONDS)) seconds."
          exit 1
